services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/up\") === false ? 1 : 0);'"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - app-storage:/app/storage/app
      - app-backups:/app/storage/app/backups
      - app-cache:/app/bootstrap/cache
    depends_on:
      setup:
        condition: service_completed_successfully

  setup:
    build:
      context: .
    env_file:
      - .env
    command: sh -c "php artisan backup:run --only-db --disable-notifications || true; php artisan optimize:clear && php artisan migrate --force && php artisan optimize"
    volumes:
      - app-backups:/app/storage/app/backups
      - app-cache:/app/bootstrap/cache
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - app-storage:/app/storage/app
      - app-backups:/app/storage/app/backups
      - app-cache:/app/bootstrap/cache
    depends_on:
      setup:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - app-storage:/app/storage/app
      - app-backups:/app/storage/app/backups
      - app-cache:/app/bootstrap/cache
    depends_on:
      setup:
        condition: service_completed_successfully

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dashboard}
      POSTGRES_USER: ${DB_USERNAME:-dashboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-storage:
  app-backups:
  app-cache:
  postgres-data:
